name: Refresh holder snapshot

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild from chain logs
        run: python3 scripts/snapshot.py
      - name: Commit if anything changed
        run: |
          git config user.name 'ledger-bot'
          git config user.email 'ledger-bot@users.noreply.github.com'
          git add data
          git diff --cached --quiet || git commit -m "data: refresh snapshot"
          git push
